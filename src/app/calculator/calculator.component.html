<h2>Some dois Números:</h2>

<mat-form-field appearance="outline" class="campo">
  <mat-label>Número1</mat-label>
  <input
    matInput
    [formControl]="textoCtrl"
    type="number"
    [(ngModel)]="number1"
    maxlength="50"
    placeholder="Digite um valor..."
  >
</mat-form-field>

<!-- <input type="number" class="lado-lado" [(ngModel)]="number2" placeholder="Número 2"> -->
<mat-form-field appearance="outline" class="lado-lado">
  <mat-label>Número2</mat-label>
  <input
    matInput
    [formControl]="textoCtrl"
    type="number"
    [(ngModel)]="number2"
    maxlength="50"
    placeholder="Digite um valor..."
  >
</mat-form-field>
<button class = "example-button-row" matButton = "filled" (click)="sumNumbers()">
        Somar
</button>
