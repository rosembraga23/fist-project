<h2 class="margem">Lista de Alunos</h2>
<div class="tabela-container table">


<table mat-table [dataSource]="alunos" class="mat-elevation-z8">

  <!-- Coluna ID -->
  <ng-container matColumnDef="id">
    <th mat-header-cell *matHeaderCellDef> ID </th>
    <td mat-cell *matCellDef="let aluno">
      {{ aluno.id }}
    </td>
  </ng-container>

  <!-- Coluna Nome -->
  <ng-container matColumnDef="nome">
    <th mat-header-cell *matHeaderCellDef> Nome </th>
    <td mat-cell *matCellDef="let aluno">
      {{ aluno.nome }}
    </td>
  </ng-container>

  <!-- Coluna Idade -->
  <ng-container matColumnDef="idade">
    <th mat-header-cell *matHeaderCellDef> Idade </th>
    <td mat-cell *matCellDef="let aluno">
      {{ aluno.idade }}
    </td>
  </ng-container>

  <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
  <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>

</table>
</div>

<router-outlet></router-outlet>
