<mat-form-field [appearance]="'outline'" class="input-container">
  <mat-label>{{ label }}</mat-label>
  <input
    matInput
    [type]="type"
    [required]="required"
    [ngClass]="[size]"
    [style.color]="color"
  />
  <mat-error *ngIf="required">
    {{ label }} é obrigatório
  </mat-error>
</mat-form-field>
